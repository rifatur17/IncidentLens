name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Scan complete Git history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          trap 'rm -rf "$scanner_dir"' EXIT
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$scanner_dir" gitleaks
          GITLEAKS_BINARY="$scanner_dir/gitleaks" python tests/security/test_gitleaks.py
          # Scan every reachable commit, including roots, without constructing base^ ranges.
          "$scanner_dir/gitleaks" git --log-opts="--all" --redact --exit-code=1 --no-banner .
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: python -m pip install -e "backend[dev]"
      - run: pnpm install --frozen-lockfile
      - run: python scripts/security/scan.py
      - run: python -m pip_audit
      - run: pnpm audit --audit-level high

